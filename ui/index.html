<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ticket2JSON</title>
    <style>
      :root { color-scheme: light; font: 16px/1.5 system-ui, sans-serif; }
      body { margin: 0; background: #f4f6fa; color: #172033; }
      main { max-width: 760px; margin: 8vh auto; padding: 2rem; background: white; border-radius: 16px; box-shadow: 0 12px 40px #17203312; }
      h1 { margin-top: 0; }
      p { color: #536078; }
      label { display: block; margin: 1.5rem 0 .5rem; font-weight: 650; }
      textarea { box-sizing: border-box; width: 100%; min-height: 170px; padding: 1rem; border: 1px solid #cbd3e1; border-radius: 8px; font: inherit; resize: vertical; }
      button { margin-top: 1rem; padding: .7rem 1.2rem; border: 0; border-radius: 8px; background: #3157d5; color: white; font: inherit; font-weight: 650; cursor: pointer; }
      button:disabled { opacity: .6; cursor: wait; }
      pre { overflow: auto; min-height: 2rem; padding: 1rem; border-radius: 8px; background: #101828; color: #e5edff; white-space: pre-wrap; overflow-wrap: anywhere; }
      #status { min-height: 1.5rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>Ticket2JSON</h1>
      <p>Classify an IT support ticket locally and return schema-constrained JSON.</p>
      <form id="ticket-form">
        <label for="ticket">Support ticket</label>
        <textarea id="ticket" required maxlength="12000" placeholder="Describe the support issue..."></textarea>
        <button id="submit" type="submit">Extract fields</button>
      </form>
      <p id="status" role="status" aria-live="polite"></p>
      <h2>Structured result</h2>
      <pre id="result" aria-label="JSON result">Your result will appear here.</pre>
    </main>
    <script src="/main.js" defer></script>
  </body>
</html>
